version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: recomp_postgres
    restart: always
    environment:
      POSTGRES_DB: recomp_db
      POSTGRES_USER: recomp_user
      POSTGRES_PASSWORD: recomp_secure_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - recomp_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recomp_backend
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://recomp_user:recomp_secure_password@db:5432/recomp_db
    volumes:
      - ./backend:/app
      - /app/recomp.db
    ports:
      - "8000:8000"
    networks:
      - recomp_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: recomp_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - recomp_network

volumes:
  postgres_data:

networks:
  recomp_network:
    driver: bridge
