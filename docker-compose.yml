version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recomp_backend
    restart: always
    environment:
      DATABASE_URL: sqlite:////app/recomp.db
    volumes:
      - ./backend/recomp.db:/app/recomp.db
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - recomp_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: recomp_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3001:80"
    networks:
      - recomp_network

networks:
  recomp_network:
    driver: bridge
